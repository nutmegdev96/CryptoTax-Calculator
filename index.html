<!-- MAIN LOGIN SCREEN - EMAIL ONLY -->
<div class="login-container" id="loginContainer">
    <div class="login-card">
        <!-- Animated Background -->
        <div class="login-bg">
            <div class="cyber-grid-small"></div>
            <div class="floating-coins">
                <i class="fab fa-bitcoin"></i>
                <i class="fab fa-ethereum"></i>
                <i class="fas fa-coins"></i>
            </div>
        </div>

        <!-- Login Content -->
        <div class="login-content">
            <div class="login-header">
                <div class="premium-badge">PREMIUM TIER</div>
                <h1 class="main-title">CRYPTOTAX</h1>
                <div class="subtitle">
                    <span class="neon-text">real-time</span> • <span class="neon-text">multi-jurisdiction</span> • <span class="neon-text">coingecko™ powered</span>
                </div>
            </div>

            <!-- EMAIL SECTION - ONLY FIELD -->
            <div class="login-body">
                <div class="email-section">
                    <div class="email-label">
                        <i class="fas fa-envelope"></i>
                        <span>EMAIL ADDRESS</span>
                    </div>
                    <div class="email-input-group">
                        <input type="email" id="loginEmail" class="email-input" placeholder="your@email.com" value="macissimon@gmail.com">
                        <div class="input-glow"></div>
                    </div>
                </div>

                <!-- Access Button -->
                <button class="access-btn" id="loginBtn">
                    <span class="btn-text">ENTER THE VAULT</span>
                    <span class="btn-icon"><i class="fas fa-arrow-right"></i></span>
                    <div class="btn-glow"></div>
                </button>

                <!-- Status Messages -->
                <div class="login-status" id="loginStatus">
                    <div class="status-message">
                        <i class="fas fa-lock"></i>
                        <span id="statusText">Enter your email to continue</span>
                    </div>
                </div>

                <!-- Admin Note (hidden by default, shown for admin login) -->
                <div class="admin-note hidden" id="adminNote">
                    <i class="fas fa-crown"></i>
                    <span>Admin access granted · Welcome back Simone</span>
                </div>
            </div>

            <!-- Footer (invariato) -->
            <div class="login-footer">
                <div class="trust-badges">
                    <span><i class="fas fa-shield-alt"></i> Bank-grade</span>
                    <span><i class="fas fa-lock"></i> Local only</span>
                    <span><i class="fas fa-btc"></i> CoinGecko</span>
                </div>
                <div class="waitlist-counter">
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 69%"></div>
                    </div>
                    <span>69% to public launch</span>
                </div>
            </div>
        </div>
    </div>
</div>
